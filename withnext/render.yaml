services:
  - type: web
    name: empresaplana-intranet
    runtime: node
    plan: free
    region: frankfurt
    buildFilter:
      paths:
        - "**"
    buildCommand: pnpm install --frozen-lockfile && pnpm run db:generate && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /intranet/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
